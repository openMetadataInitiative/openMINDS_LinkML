default_prefix: omi
enums:
  AgeCategory:
    enum_uri: https://openminds.om-i.org/types/AgeCategory
    title: Age category
    description: Structured information on the life cycle (semantic term) of a specific
      age group.
    permissible_values:
      adolescent:
        description: Life cycle stage of a subject loosely defined by the transitional
          growth and development between childhood and adulthood, often described
          as 'puberty'.
      infant:
        description: Life cycle stage of a mammalian subject that follows the neonate
          stage and ends at weaning.
      perinate:
        description: Life cycle stage of a subject that starts right before and ends
          right after birth.
      adult:
        description: Life cycle stage of a subject that starts with sexual maturity
          and ends with death.
      late adult:
        description: Life cycle stage of a subject that follows the prime adult stage
          and ends with death.
      young adult:
        description: Life cycle stage of a subject that starts with sexual maturity
          and ends with the cessation of growth (if reached after sexual maturity).
      neonate:
        description: Life cycle stage of a subject that immediately follows birth.
      juvenile:
        description: Life cycle stage of a subject that starts with the independence
          of the nest and/or caregiver and ends with sexual maturity.
      prime adult:
        description: Life cycle stage of a subject that starts with sexual maturity
          or the cessation of growth, whichever comes last, and ends before senescence.
      embryo:
        description: Life cycle stage of a subject that starts with fertilization
          and ends with the fully formed embryo.
